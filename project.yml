name: TOSS
options:
  bundleIdPrefix: com.dooleydarko.toss
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"

settings:
  SWIFT_VERSION: "5.7"
  MARKETING_VERSION: "0.1.2"
  CURRENT_PROJECT_VERSION: "3"
  ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TOSS-iOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: apps/ios/Sources
      - path: packages/handoff-schema/Sources
      - path: packages/transfer-protocol/Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dooleydarko.toss.ios
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_FILE: apps/ios/Info.plist
      GENERATE_INFOPLIST_FILE: NO

  TOSS-Receiver:
    type: tool
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: apps/macos-receiver/Sources
      - path: packages/handoff-schema/Sources
      - path: packages/transfer-protocol/Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dooleydarko.toss.receiver
      ONLY_ACTIVE_ARCH: NO
      ARCHS: "x86_64 arm64"

  TOSS-Desktop:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: apps/macos-dashboard/Sources
      - path: packages/handoff-schema/Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dooleydarko.toss.desktop
      GENERATE_INFOPLIST_FILE: YES
      ONLY_ACTIVE_ARCH: NO
      ARCHS: "x86_64 arm64"

  TOSS-iOS-UI-Tests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: apps/ios/UITests
    dependencies:
      - target: TOSS-iOS
    settings:
      GENERATE_INFOPLIST_FILE: YES

schemes:
  TOSS-iOS:
    build:
      targets:
        TOSS-iOS: all
        TOSS-iOS-UI-Tests: [test]
    test:
      targets:
        - TOSS-iOS-UI-Tests
  TOSS-Receiver:
    build:
      targets:
        TOSS-Receiver: all
  TOSS-Desktop:
    build:
      targets:
        TOSS-Desktop: all
